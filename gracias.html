<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Gracias! | EIRP Construcciones</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .gracias { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; background: var(--color-light); padding: 40px 16px; }
    .gracias__card { background: var(--color-white); padding: 48px 32px; border-radius: var(--radius); box-shadow: var(--shadow-md); max-width: 520px; }
    .gracias__card img { height: 80px; margin: 0 auto 24px; }
    .gracias__card h1 { font-family: var(--font-heading); font-weight: 800; color: var(--color-dark); margin-bottom: 12px; }
    .gracias__card p { color: var(--color-gray); margin-bottom: 28px; }
  </style>
</head>
<body>
  <main class="gracias">
    <div class="gracias__card">
      <img src="assets/logo.png" alt="EIRP Construcciones">
      <h1>¡Solicitud recibida!</h1>
      <p>Gracias por escribirnos. Revisaremos tu proyecto y te contactaremos a la brevedad.</p>
      <a href="/" class="btn btn--primary">Volver al inicio</a>
    </div>
  </main>
</body>
</html>
